version: '3.8'

services:
  backend:
    build: .
    container_name: deepagents-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # 挂载数据目录（SQLite + 用户数据）
    environment:
      - DATABASE_URL=sqlite:///./data/deepagents.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-this}
      - USE_SQLITE_CHECKPOINTER=true
      - LLM_API_KEY=${LLM_API_KEY}
      - BASE_URL=${BASE_URL:-https://api.bltcy.ai/v1}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
