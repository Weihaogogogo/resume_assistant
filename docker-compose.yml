version: '3.8'

services:
  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepagents-backend:latest
    container_name: deepagents-backend
    ports:
      - "127.0.0.1:8000:8000"  # 只监听本地，Nginx 代理访问
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/deepagents.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - USE_SQLITE_CHECKPOINTER=true
      - CHECKPOINTER_DB_PATH=/app/data/checkpointer.db
      - LLM_API_KEY=${LLM_API_KEY}
      - BASE_URL=${BASE_URL:-https://api.openai.com/v1}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -X POST -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理 + 前端静态文件
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepagents-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
