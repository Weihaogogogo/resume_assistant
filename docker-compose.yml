version: '3.8'

services:
  # 前端构建服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deepagents-frontend:latest
    container_name: deepagents-frontend
    restart: unless-stopped
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend

  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepagents-backend:latest
    container_name: deepagents-backend
    ports:
      - "127.0.0.1:8000:8000"  # 只监听本地，Nginx 代理访问
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/deepagents.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - USE_SQLITE_CHECKPOINTER=true
      - LLM_API_KEY=${LLM_API_KEY}
      - BASE_URL=${BASE_URL:-https://api.openai.com/v1}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: deepagents-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  data:
